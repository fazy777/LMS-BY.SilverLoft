<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver Loft — Learn without limits</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;800&display=swap');

  :root{
    --color-primary:#112A46;
    --color-secondary:#ACC8E5;
    --color-tint:#EAF1FA;
    --color-ink:#0B1B2E;
    --color-surface:#FFFFFF;
    --color-muted:#64748B;
    --color-border:#E2E8F0;
    --color-success:#16A34A;
    --color-warning:#D97706;
    --color-danger:#DC2626;
    --shadow-modal:0 30px 80px -20px rgba(17,42,70,0.35);
    --shadow-card:0 4px 20px -2px rgba(17,42,70,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--color-ink);
    background:var(--color-tint);
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--color-secondary);color:var(--color-ink);}

  .h-display1{font-size:34px;line-height:1.15;font-weight:600;letter-spacing:-0.02em;}
  .h-display2{font-size:26px;line-height:1.25;font-weight:600;letter-spacing:-0.015em;}
  .h-section{font-size:20px;line-height:1.3;font-weight:600;}
  .h-card{font-size:16px;line-height:1.4;font-weight:600;}
  .t-body{font-size:14.5px;line-height:1.6;color:#334155;}
  .t-helper{font-size:13px;line-height:1.5;color:var(--color-muted);}
  .t-micro{font-size:11px;line-height:1;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;}
  .t-otp{font-size:30px;font-weight:800;letter-spacing:8px;font-family:'JetBrains Mono',monospace;}

  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
  @media (max-width:768px){.wrap{padding:0 18px;}}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:transform .15s ease, background .15s ease, box-shadow .15s ease;white-space:nowrap;}
  .btn:active{transform:translateY(1px) scale(0.98);}
  .btn-primary{background:var(--color-primary);color:#fff;}
  .btn-primary:hover{background:var(--color-ink);}
  .btn-secondary{background:#fff;color:var(--color-primary);border-color:var(--color-border);}
  .btn-secondary:hover{border-color:var(--color-primary);}
  .btn-ghost{background:transparent;color:var(--color-primary);}
  .btn-ghost:hover{background:var(--color-tint);}
  .btn-danger-ghost{background:transparent;color:var(--color-danger);}
  .btn-danger-ghost:hover{background:#FEF2F2;}
  .btn-sm{height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  /* ---------- inputs ---------- */
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--color-primary);}
  .field .helper{font-size:12px;color:var(--color-muted);}
  .field .err{font-size:12px;color:var(--color-danger);display:none;}
  .field.invalid .err{display:block;}
  .field.invalid input{border-color:var(--color-danger);}
  .input, select.input{height:50px;border-radius:12px;border:1px solid var(--color-border);background:#fff;padding:0 16px;font-size:14.5px;color:var(--color-ink);width:100%;outline:none;transition:box-shadow .15s ease, border-color .15s ease;}
  .input:focus, select.input:focus{border-color:var(--color-primary);box-shadow:0 0 0 4px rgba(172,200,229,.4);}
  .input-icon-wrap{position:relative;}
  .input-icon-wrap .input{padding-right:46px;}
  .input-icon-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-muted);display:flex;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#334155;}
  .checkbox-row input{width:16px;height:16px;accent-color:var(--color-primary);}

  /* ---------- cards / surfaces ---------- */
  .card{background:#fff;border:1px solid var(--color-border);border-radius:16px;box-shadow:var(--shadow-card);}
  .modal-surface{border-radius:28px;box-shadow:var(--shadow-modal);}
  .pill{border-radius:9999px;padding:4px 12px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;}
  .pill-tint{background:var(--color-tint);color:var(--color-primary);}
  .pill-success{background:#DCFCE7;color:var(--color-success);}
  .pill-warning{background:#FEF3C7;color:var(--color-warning);}
  .pill-danger{background:#FEE2E2;color:var(--color-danger);}
  .pill-gray{background:#F1F5F9;color:var(--color-muted);}

  .icon{width:18px;height:18px;flex-shrink:0;}
  .icon-sm{width:14px;height:14px;}
  .icon-lg{width:24px;height:24px;}

  /* ---------- marketing header ---------- */
  .site-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-border);}
  .site-header .bar{display:flex;align-items:center;gap:28px;height:76px;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-0.02em;color:var(--color-primary);flex-shrink:0;}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(155deg,var(--color-primary),var(--color-ink));display:flex;align-items:center;justify-content:center;color:var(--color-secondary);}
  .nav-links{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .nav-links a{padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;color:#334155;}
  .nav-links a:hover, .nav-links a.active{background:var(--color-tint);color:var(--color-primary);}
  .header-search{flex:1;position:relative;max-width:420px;}
  .header-search input{height:44px;padding-left:42px;border-radius:9999px;background:var(--color-tint);border:1px solid transparent;}
  .header-search input:focus{background:#fff;border-color:var(--color-secondary);}
  .header-search .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--color-muted);}
  .header-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}

  /* ---------- app shell (dashboard/instructor/admin) ---------- */
  .app-shell{display:flex;min-height:100dvh;background:var(--color-tint);}
  .app-sidebar{width:248px;background:var(--color-primary);color:#EAF1FA;flex-shrink:0;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100dvh;}
  .app-sidebar .logo{color:#fff;padding:0 8px;}
  .app-sidebar .logo .mark{background:rgba(255,255,255,.12);}
  .side-group{display:flex;flex-direction:column;gap:2px;}
  .side-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#7C93AE;padding:8px 12px 4px;}
  .side-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:#C9D9EA;}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff;}
  .side-link.active{background:rgba(255,255,255,.12);color:#fff;}
  .side-link.active .icon{color:var(--color-secondary);}
  .app-main{flex:1;min-width:0;}
  .app-topbar{height:76px;display:flex;align-items:center;gap:16px;padding:0 32px;background:#fff;border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:10;}
  .app-content{padding:32px;}
  @media (max-width:900px){.app-sidebar{display:none;}.app-content{padding:20px;}.app-topbar{padding:0 20px;}}

  /* ---------- grids ---------- */
  .grid-courses{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  @media (max-width:1100px){.grid-courses{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:768px){.grid-courses{grid-template-columns:repeat(2,1fr);gap:14px;}}
  @media (max-width:480px){.grid-courses{grid-template-columns:1fr;}}

  .course-card{background:#fff;border-radius:16px;border:1px solid var(--color-border);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .18s ease, box-shadow .18s ease;display:flex;flex-direction:column;}
  .course-card:hover{transform:translateY(-3px);box-shadow:0 16px 34px -12px rgba(17,42,70,.18);}
  .course-thumb{aspect-ratio:16/9;position:relative;display:flex;align-items:flex-end;padding:12px;}
  .course-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .course-title{font-size:15px;font-weight:600;line-height:1.35;color:var(--color-ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px;}
  .course-instr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-muted);}
  .course-instr .mini-avatar{width:20px;height:20px;border-radius:50%;flex-shrink:0;}
  .course-meta-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .stars{display:flex;align-items:center;gap:4px;color:var(--color-warning);font-size:13px;font-weight:700;}
  .stars .icon{color:var(--color-warning);}
  .price{font-weight:800;font-size:16px;color:var(--color-primary);}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(180deg,var(--color-tint) 0%,#fff 100%);padding:64px 0 56px;border-bottom:1px solid var(--color-border);}
  .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .category-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
  .category-pills button{border-radius:9999px;padding:8px 16px;font-size:13px;font-weight:600;border:1px solid var(--color-border);background:#fff;color:#334155;}
  .category-pills button:hover, .category-pills button.active{border-color:var(--color-primary);background:var(--color-primary);color:#fff;}

  .hero-visual{position:relative;height:390px;}
  .float-card{position:absolute;background:#fff;border-radius:16px;box-shadow:var(--shadow-modal);padding:14px 16px;display:flex;align-items:center;gap:12px;}
  .hero-mainpanel{position:absolute;inset:20px 60px 20px 0;border-radius:28px;background:linear-gradient(155deg,var(--color-primary),#1a3f66 55%, var(--color-ink));box-shadow:var(--shadow-modal);overflow:hidden;}
  .hero-mainpanel::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.14) 1px, transparent 0);background-size:26px 26px;}

  /* ---------- catalog ---------- */
  .catalog-layout{display:grid;grid-template-columns:264px 1fr;gap:32px;align-items:start;}
  @media (max-width:860px){.catalog-layout{grid-template-columns:1fr;}}
  .filter-block{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--color-border);}
  .filter-block:last-child{border-bottom:none;}
  .filter-title{font-size:13px;font-weight:700;color:var(--color-primary);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
  .filter-check{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#334155;padding:6px 0;}
  .filter-check input{width:16px;height:16px;accent-color:var(--color-primary);}

  /* ---------- sales page ---------- */
  .sales-layout{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start;}
  @media (max-width:920px){.sales-layout{grid-template-columns:1fr;}.sticky-buy{position:static !important;}}
  .sticky-buy{position:sticky;top:96px;}
  .video-frame{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(155deg,var(--color-primary),var(--color-ink));position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--color-border);}
  .play-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff;}

  .accordion-item{border:1px solid var(--color-border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .accordion-head{display:flex;align-items:center;justify-content:between;gap:12px;padding:14px 16px;background:#F8FAFC;cursor:pointer;}
  .accordion-head .chev{margin-left:auto;transition:transform .2s ease;color:var(--color-muted);}
  .accordion-item.open .chev{transform:rotate(180deg);}
  .accordion-body{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .accordion-item.open .accordion-body{max-height:600px;}
  .lesson-row{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13.5px;color:#334155;border-top:1px solid var(--color-border);}
  .lesson-row .icon{color:var(--color-muted);}
  .lesson-row .dur{margin-left:auto;color:var(--color-muted);font-size:12.5px;}

  .rating-bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--color-muted);}
  .rating-bar-track{flex:1;height:8px;border-radius:99px;background:#F1F5F9;overflow:hidden;}
  .rating-bar-fill{height:100%;background:var(--color-warning);border-radius:99px;}

  /* ---------- progress ---------- */
  .progress-track{height:8px;border-radius:99px;background:#F1F5F9;overflow:hidden;}
  .progress-fill{height:100%;background:var(--color-success);border-radius:99px;}

  /* ---------- tables ---------- */
  table.data-table{width:100%;border-collapse:collapse;}
  .data-table th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-muted);font-weight:700;padding:0 16px 12px;border-bottom:1px solid var(--color-border);}
  .data-table td{padding:14px 16px;border-bottom:1px solid var(--color-border);font-size:13.5px;vertical-align:middle;}
  .data-table tr:last-child td{border-bottom:none;}
  .table-thumb{width:56px;height:36px;border-radius:8px;flex-shrink:0;}

  /* ---------- OTP ---------- */
  .otp-row{display:flex;gap:10px;justify-content:center;}
  .otp-box{width:52px;height:60px;border-radius:12px;border:1.5px solid var(--color-border);text-align:center;}
  .otp-box:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 4px rgba(172,200,229,.4);}

  /* ---------- strength meter ---------- */
  .strength-row{display:flex;gap:5px;}
  .strength-seg{height:5px;flex:1;border-radius:99px;background:#E2E8F0;}

  /* ---------- misc ---------- */
  .divider-label{display:flex;align-items:center;gap:12px;color:var(--color-muted);font-size:12.5px;}
  .divider-label::before,.divider-label::after{content:'';flex:1;height:1px;background:var(--color-border);}
  .kbadge{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .stat-card{background:#fff;border:1px solid var(--color-border);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow-card);}
  .stat-card .stat-num{font-size:26px;font-weight:700;letter-spacing:-0.01em;color:var(--color-primary);}
  .toggle{width:40px;height:22px;border-radius:99px;background:#E2E8F0;position:relative;transition:background .15s;flex-shrink:0;}
  .toggle.on{background:var(--color-success);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .toggle.on .knob{transform:translateX(18px);}

  .fade-in{animation:fadeIn .3s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- proto switcher ---------- */
  #proto-switch{position:fixed;bottom:18px;left:18px;z-index:100;background:var(--color-ink);border-radius:16px;box-shadow:var(--shadow-modal);padding:8px;display:flex;gap:4px;max-width:calc(100vw - 36px);overflow-x:auto;}
  #proto-switch button{white-space:nowrap;border:none;background:transparent;color:#93A9C2;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;}
  #proto-switch button.active{background:var(--color-primary);color:#fff;}
  #proto-switch button:hover:not(.active){color:#fff;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:#C9D9EA;border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="proto-switch"></div>

<script>
/* =========================================================================
   ICONS — small inline SVG set

  upload:'<path d="M12 3v13"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/>',
  bank:'<path d="m3 10 9-6 9 6"/><path d="M5 10v9M10 10v9M14 10v9M19 10v9"/><path d="M3 21h18"/>',

function icon(name, cls='icon'){
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;
}
function stars(rating, count){
  let s='';
  for(let i=1;i<=5;i++){ s += icon(i<=Math.round(rating)?'star':'starOutline','icon-sm'); }
  return `<span class="stars">${rating.toFixed(1)} ${s} ${count?`<span style="color:var(--color-muted);font-weight:500;">(${count.toLocaleString()})</span>`:''}</span>`;
}
function thumbGradient(seed){
  const grads = [
    'linear-gradient(135deg,#112A46,#3B6396)','linear-gradient(135deg,#0B1B2E,#5C87AC)',
    'linear-gradient(135deg,#1B3A5C,#ACC8E5)','linear-gradient(135deg,#112A46,#16A34A 180%)',
    'linear-gradient(135deg,#2A4A70,#0B1B2E)','linear-gradient(135deg,#112A46,#D97706 200%)'
  ];
  return grads[seed % grads.length];
}

function updateStrength(val){
  const segs = document.querySelectorAll('#strengthRow .strength-seg');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if(val.length>=6) score++;
  if(val.length>=10) score++;
  if(/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
  if(/[^A-Za-z0-9]/.test(val)) score++;
  const colors = ['var(--color-danger)','var(--color-warning)','#CA8A04','var(--color-success)'];
  const labels = ['Weak','Fair','Good','Strong'];
  segs.forEach((s,i)=>{ s.style.background = i<score ? colors[Math.max(score-1,0)] : '#E2E8F0'; });
  label.textContent = val.length===0 ? 'Weak' : labels[Math.max(score-1,0)];
}
window.updateStrength = updateStrength;

      <div class="otp-row" style="margin:28px 0 8px;" id="otpRow">
        ${[0,1,2,3,4,5].map(i=>`<input maxlength="1" class="otp-box t-otp" oninput="otpAdvance(this,${i})" onpaste="otpPaste(event)">`).join('')}
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="go('dashboard',event)">Verify Email</button>
      <p class="t-helper" style="margin-top:18px;">Didn't get it? <a href="#" style="color:var(--color-primary);font-weight:600;">Resend code</a> <span id="cooldown">(0:58)</span></p>
    </div>
  </div>`;
}
function otpAdvance(el, idx){
  el.value = el.value.replace(/[^0-9]/g,'');
  if(el.value && el.nextElementSibling) el.nextElementSibling.focus();
}
function otpPaste(ev){
  ev.preventDefault();
  const text = (ev.clipboardData.getData('text')||'').replace(/[^0-9]/g,'').slice(0,6);
  const boxes = document.querySelectorAll('#otpRow .otp-box');
  text.split('').forEach((ch,i)=>{ if(boxes[i]) boxes[i].value = ch; });
  if(boxes[Math.min(text.length,5)]) boxes[Math.min(text.length,5)].focus();
}
window.otpAdvance = otpAdvance; window.otpPaste = otpPaste;

              <button class="btn btn-danger-ghost" style="border:1px solid var(--color-border);flex:1;">${icon('x','icon-sm')} Reject Course</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>@media (max-width:860px){.admin-grid{grid-template-columns:1fr !important;}}</style>`;
}

/* =========================================================================
   RENDER
========================================================================= */
function render(){
  const root = document.getElementById('root');
  const map = {
    'landing': pageLanding, 'catalog': pageCatalog, 'course-detail': pageCourseDetail,
    'login': pageLogin, 'signup': pageSignup, 'verify': pageVerify,
    'dashboard': pageDashboard, 'player': pagePlayer,
    'instructor-dashboard': pageInstructorDashboard, 'instructor-courses': pageInstructorCourses,
    'admin-pending': pageAdminPending,
  };
  const fn = map[state.page] || pageLanding;
  root.innerHTML = `<div class="fade-in">${fn()}</div>`;
  renderProtoSwitch();
}
render();
</script>
</body>
